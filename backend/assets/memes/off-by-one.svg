<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
<title id="t">There are two hard problems: naming things, cache invalidation and off-by-one errors</title>
<rect width="400" height="400" fill="#bfdbfe"/>
<rect x="50" y="60" width="300" height="120" rx="10" fill="#1e1e2e"/><text x="66" y="90" font-family="monospace" font-size="16" fill="#f9e2af" xml:space="preserve">for (i = 0; i &lt;= n; i++)</text><text x="66" y="114" font-family="monospace" font-size="16" fill="#f9e2af" xml:space="preserve">  arr[i]; // boom</text><text x="66" y="138" font-family="monospace" font-size="16" fill="#f9e2af" xml:space="preserve"></text><text x="66" y="162" font-family="monospace" font-size="16" fill="#f9e2af" xml:space="preserve">// arr[n] is undefined</text>
<rect y="270" width="400" height="130" fill="#000" opacity="0.55"/>
<text x="200" y="298" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">THERE ARE TWO HARD</text>
<text x="200" y="326" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">PROBLEMS: NAMING THINGS,</text>
<text x="200" y="354" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">CACHE INVALIDATION AND</text>
<text x="200" y="382" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">OFF-BY-ONE ERRORS</text>
</svg>
