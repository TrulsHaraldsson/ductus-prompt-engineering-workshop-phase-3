<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
<title id="t">git push --force: living on the edge</title>
<rect width="400" height="400" fill="#fed7aa"/>
<rect x="50" y="60" width="300" height="120" rx="10" fill="#1e1e2e"/><text x="66" y="90" font-family="monospace" font-size="16" fill="#a6e3a1" xml:space="preserve">$ git push --force</text><text x="66" y="114" font-family="monospace" font-size="16" fill="#f38ba8" xml:space="preserve">+ 3 commits overwritten</text><text x="66" y="138" font-family="monospace" font-size="16" fill="#f38ba8" xml:space="preserve">+ teammate's work gone</text><text x="66" y="162" font-family="monospace" font-size="16" fill="#89dceb" xml:space="preserve">$ echo oops</text>
<rect y="270" width="400" height="130" fill="#000" opacity="0.55"/>
<text x="200" y="298" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">GIT PUSH --FORCE: LIVING</text>
<text x="200" y="326" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ON THE EDGE</text>
</svg>
