<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
<title id="t">It will take two days. (Two weeks later)</title>
<rect width="400" height="400" fill="#bbf7d0"/>
<rect x="80" y="70" width="240" height="150" rx="12" fill="#fff"/><text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#16a34a">2 days</text><text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">estimate</text>
<rect y="270" width="400" height="130" fill="#000" opacity="0.55"/>
<text x="200" y="298" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">IT WILL TAKE TWO DAYS.</text>
<text x="200" y="326" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">(TWO WEEKS LATER)</text>
</svg>
