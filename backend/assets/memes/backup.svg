<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
<title id="t">Nobody tests backups until the day they need one</title>
<rect width="400" height="400" fill="#c7d2fe"/>
<rect x="80" y="70" width="240" height="150" rx="12" fill="#fff"/><text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#4338ca">backup.zip</text><text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#555">0 bytes</text>
<rect y="270" width="400" height="130" fill="#000" opacity="0.55"/>
<text x="200" y="298" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">NOBODY TESTS BACKUPS</text>
<text x="200" y="326" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">UNTIL THE DAY THEY NEED</text>
<text x="200" y="354" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#fff" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ONE</text>
</svg>
